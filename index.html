<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Soundcloud Likes Search</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=700px">
    <style>
      @media screen and (max-device-width: 480px) {
        body {
          /* make iPhone display the same as browser */
          -webkit-text-size-adjust: 100%;
        }
      }
      html {
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
      }
      #page {
        width: 720px;
        background-color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: white;
        font-family: monospace;
        margin-left: auto;
        margin-right: auto;
        gap: 8px;
        padding-top: 8px;
        padding-bottom: 8px;
      }
      #header {
        font-size: 24px;
      }
      #search {
        display: flex;
        justify-content: space-evenly;
        width: 100%;
      }
      #status {
        font-size: 12px;
        color: #888;
      }
      #results {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .entry {
        display: flex;
        flex-direction: column;
        width: 80%;
        background-color: black;
        padding: 4px;
      }
      .art {
        position: relative;
        width: 75px;
        height: 75px;
      }
      img.artwork_url {
        display: block;
        width: 70px;
      }
      img.avatar_url {
        display: block;
        width: 30px;
        position: absolute;
        top: 45px;
        left: 45px;
      }
      .art.no-artwork img.avatar_url {
        position: static;
        width: 75px;
        height: 75px;
        object-fit: cover;
      }
      a {
        color: orange;
        text-decoration: none;
      }
      .id {
        align-self: flex-end;
        .permalink_url {
          font-size: 10px;
        }
      }
      .title {
        font-size: 16px;
        .permalink_url {
          font-size: inherit
        }
      }
      .song {
        display: flex;
        gap: 8px;
        align-items: stretch;
      }
      .datetime {
        font-size: 10px;
        align-self: flex-end;
      }
      .info {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 2px;
        flex-grow: 2;
      }
      .taglist {
        font-size: 10px;
        align-self: flex-end;
      }
      .metadata {
        display: flex;
        flex-direction: column;
      }
      #results_template {
        display: none;
      }
    </style>
    <script>
      const API_BASE_URL = '__API_BASE_URL__';
      const API_BASE = (API_BASE_URL.startsWith('__') ? 'http://localhost:3000' : API_BASE_URL).replace(/\/$/, '');
      const LIKES_LIMIT = 200;
      const LIKE_REQUEST_DELAY_MS = 1250;

      let cached_user = null;
      let cached_likes = null;
      let cached_likes_estimate = null;
      let cached_username = null;
      let active_search_id = 0;

      function set_status(msg) {
        document.getElementById("status").textContent = msg;
      }

      function clear_results() {
        document.getElementById("results").innerHTML = '';
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function get_likes_estimate(data) {
        const value = data?.likes_estimate ?? data?.public_favorites_count ?? data?.likes_count;
        if (value === null || value === undefined || value === '') return null;

        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      }

      function fetch_status(loaded, estimate) {
        const total = estimate === null ? '?' : `~${estimate}`;
        return `fetching ${loaded} out of ${total} likes`;
      }

      function show_status(count, loaded, estimate) {
        if (estimate === null) {
          return `showing ${count} of ${loaded} loaded likes`;
        }

        return `showing ${count} of ${loaded} loaded likes (fetched ${loaded} out of ~${estimate})`;
      }

      function next_offset_from_href(next_href) {
        if (!next_href) return null;

        try {
          return new URL(next_href).searchParams.get("offset");
        } catch (error) {
          return null;
        }
      }

      async function api_get(path, params) {
        const response = await fetch(`${API_BASE}${path}?${params.toString()}`);
        let data = null;

        try {
          data = await response.json();
        } catch (error) {
          data = null;
        }

        if (!response.ok) {
          throw new Error(data?.error || response.statusText);
        }

        return data;
      }

      function render_entry(track, user_avatar) {
        const template = document.querySelector("#results_template .entry");
        const entry = template.cloneNode(true);

        const artwork = track.artwork_url;
        const avatar = track.user?.avatar_url || user_avatar;
        const art_div = entry.querySelector(".art");

        if (artwork) {
          entry.querySelector("img.artwork_url").src = artwork;
          entry.querySelector("img.avatar_url").src = avatar;
        } else {
          art_div.classList.add("no-artwork");
          entry.querySelector("img.artwork_url").remove();
          entry.querySelector("img.avatar_url").src = avatar;
        }

        entry.querySelector(".title .permalink_url").href = track.permalink_url;
        entry.querySelector(".title .permalink_url").textContent = track.title;

        const artist = track.user?.username || '';
        const album = track.publisher_metadata?.album_title || '';

        entry.querySelector(".artist").textContent = artist;
        entry.querySelector(".album").textContent = album;
        entry.querySelector(".album_artist_sep").style.display = album ? '' : 'none';

        entry.querySelector(".datetime").textContent = track.created_at || '';

        const tags = track.tag_list || '';
        entry.querySelector(".taglist").textContent = tags ? `[${tags}]` : '';

        return entry;
      }

      function display_likes(likes, filter_text, user_avatar, status_text = null) {
        clear_results();
        const results = document.getElementById("results");
        const filter_lower = filter_text.toLowerCase();

        let count = 0;
        for (const item of likes) {
          const track = item.track;
          if (!track) continue;

          // filter by title / artist / tags
          if (filter_text) {
            const searchable = [
              track.title || '',
              track.user?.username || '',
              track.tag_list || '',
              track.publisher_metadata?.album_title || ''
            ].join(' ').toLowerCase();

            if (!searchable.includes(filter_lower)) continue;
          }

          results.appendChild(render_entry(track, user_avatar));
          count++;
        }

        set_status(status_text || show_status(count, likes.length, cached_likes_estimate));
      }

      async function get_likes(urn, user_avatar, search_id) {
        cached_likes = [];
        let next_offset = null;

        set_status(fetch_status(0, cached_likes_estimate));

        while (true) {
          const params = new URLSearchParams({
            urn: urn,
            limit: String(LIKES_LIMIT)
          });

          if (next_offset) {
            params.set("offset", next_offset);
          }

          let data;

          try {
            data = await api_get("/likes", params);
          } catch (error) {
            if (search_id === active_search_id) {
              set_status(`error: ${error.message}`);
            }
            return;
          }

          if (search_id !== active_search_id) return;

          const page_likes = Array.isArray(data.collection) ? data.collection : [];
          cached_likes.push(...page_likes);

          const estimate = get_likes_estimate(data);
          if (estimate !== null) {
            cached_likes_estimate = estimate;
          }

          const filter = document.getElementById("filter").value;
          const next_href = data.next_href || null;
          const paging_status = next_href ? fetch_status(cached_likes.length, cached_likes_estimate) : null;

          display_likes(cached_likes, filter, user_avatar, paging_status);

          if (!next_href) break;

          next_offset = next_offset_from_href(next_href);

          if (!next_offset) {
            set_status("error: missing next offset");
            return;
          }

          await sleep(LIKE_REQUEST_DELAY_MS);

          if (search_id !== active_search_id) return;
        }

        const filter = document.getElementById("filter").value;
        display_likes(cached_likes, filter, user_avatar);
      }

      async function search() {
        const username = document.getElementById("username").value.trim();
        const filter = document.getElementById("filter").value;
        const username_key = username.toLowerCase();

        if (!username) {
          set_status('enter a username');
          return;
        }

        // if same user re-filter from cache
        if (cached_user && cached_username === username_key && cached_likes) {
          display_likes(cached_likes, filter, cached_user.avatar_url);
          return;
        }

        set_status('resolving urn...');
        clear_results();

        const search_id = ++active_search_id;
        const params = new URLSearchParams({username: username});

        try {
          const data = await api_get("/username", params);
          if (search_id !== active_search_id) return;

          cached_user = data;
          cached_likes = null;
          cached_likes_estimate = get_likes_estimate(data);
          cached_username = username_key;

          const urn = data.urn.split(":")[2]; // soundcloud:users:100420690
          await get_likes(urn, data.avatar_url, search_id);
        } catch (error) {
          if (search_id === active_search_id) {
            set_status(`error: ${error.message}`);
          }
        }
      }

      // use cached likes for additional filtering
      function apply_filter() {
        if (cached_likes && cached_user) {
          const filter = document.getElementById("filter").value;
          display_likes(cached_likes, filter, cached_user.avatar_url);
        }
      }
    </script>
  </head>
  <body>
    <div id="page">
      <div id="header">SoundCloud Likes Search</div>
        <div id="search">
          <div>
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Username" required onkeydown="if(event.key === 'Enter') search()">
          </div>
          <div>
            <label for="filter">Filter:</label>
            <input type="text" id="filter" placeholder="title/artist/tags" oninput="apply_filter()" onkeydown="if(event.key === 'Enter') search()">
          </div>
          <div>
            <input type="submit" onclick="search()" value="Search / List">
          </div>
        </div>
      <div id="status"></div>
      <div id="results">
      </div>
      <div id="results_template">
        <div class="entry">
          <div class="song">
            <div class="art">
              <img class="artwork_url" onerror="this.onerror=null; this.parentElement.classList.add('no-artwork'); this.remove()" />
              <img class="avatar_url" onerror="this.onerror=null; this.src='https://sav.estate/files/unknown_avatar_url.png'" />
            </div>
            <div class="info">
              <div>
                <div class="title"><a href="" class="permalink_url"></a></div>
                <div class="artist_album"><span class="artist"></span><span class="album_artist_sep"> - </span><span class="album"></span></div>
              </div>
              <div class="metadata">
                <div class="datetime"></div>
                <div class="taglist"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
